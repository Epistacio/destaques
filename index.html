<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redes sociais</title>
  <meta name="description" content="Página central com o destaque do momento e todos os perfis oficiais nas redes sociais.">
  <meta name="theme-color" content="#0a3424">
  <!-- Fontes de apoio (opcionais): sem internet, o site usa as fontes do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilo.css?v=3">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="#destaque">
        <img id="marca-logo" class="marca-logo" alt="" hidden>
        <span class="marca-texto">
          <span id="marca-nome" class="marca-nome"></span>
          <span id="marca-sub" class="marca-sub"></span>
        </span>
      </a>
      <nav class="nav" aria-label="Seções da página">
        <ul>
          <li><a href="#destaque">Destaque</a></li>
          <li><a href="#redes">Redes</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <!-- DESTAQUE: conteúdo vem de dados/tema.js -->
    <section id="destaque" class="destaque" aria-labelledby="tema-titulo">
      <div class="destaque-interno">
        <div class="destaque-texto">
          <p id="tema-meta" class="destaque-meta">
            <span id="tema-etiqueta" class="etiqueta"></span>
            <span id="tema-periodo" class="periodo"></span>
          </p>
          <h1 id="tema-titulo" class="destaque-titulo"></h1>
          <p id="tema-descricao" class="destaque-descricao"></p>
          <a id="tema-botao" class="botao" href="#">
            <span id="tema-botao-texto"></span>
            <span class="botao-seta" aria-hidden="true">→</span>
          </a>
          <ul id="tema-dados" class="destaque-dados" hidden></ul>
        </div>
        <figure class="destaque-midia">
          <img id="tema-imagem" alt="" width="1200" height="900" decoding="async">
        </figure>
      </div>
    </section>

    <!-- REDES: conteúdo vem de dados/redes.js -->
    <section id="redes" class="redes" aria-labelledby="redes-titulo">
      <div class="redes-interno">
        <header class="redes-cabecalho">
          <h2 id="redes-titulo"></h2>
          <p id="redes-texto"></p>
        </header>
        <ul id="redes-lista" class="redes-lista"></ul>
      </div>
    </section>
  </main>

  <!-- RODAPÉ: conteúdo vem de dados/site.js -->
  <footer class="rodape">
    <div class="rodape-interno">
      <div class="rodape-marca">
        <img id="rodape-logo" class="rodape-logo" alt="" hidden>
        <p id="rodape-nome" class="rodape-nome"></p>
      </div>
      <p id="rodape-texto" class="rodape-texto"></p>
      <section id="contato" class="contato" aria-labelledby="contato-titulo">
        <h2 id="contato-titulo" class="visualmente-oculto">Contato</h2>
        <ul id="contato-lista" class="contato-lista"></ul>
      </section>
      <p class="rodape-ano">© <span id="ano"></span> <span id="rodape-ano-nome"></span></p>
    </div>
  </footer>

  <noscript><p class="sem-js">Ative o JavaScript para ver o destaque e os links das redes sociais.</p></noscript>

  <!-- 1) Dados editáveis  2) Ícones  3) Montagem da página -->
  <script src="dados/site.js?v=3"></script>
  <script src="dados/tema.js?v=3"></script>
  <script src="dados/redes.js?v=3"></script>
  <script src="js/icones.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
